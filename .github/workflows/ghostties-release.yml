# Ghostties Release Workflow
#
# Builds, signs, notarizes, and publishes a Ghostties release to GitHub Releases.
# Triggered by version tags (e.g. v0.1.0, v0.1.0-beta.1).
#
# Key differences from upstream release-tag.yml:
#   - Builds GhosttyKit.xcframework from source via Zig (gitignored — not committed)
#   - Uses standard macos-latest runners instead of Namespace Labs runners
#   - Uploads to GitHub Releases instead of Cloudflare R2
#   - Produces separate stable and beta appcast files for Sparkle auto-updates
#
# Required secrets:
#   PROD_MACOS_CERTIFICATE        — base64-encoded Developer ID Application .p12 cert
#   PROD_MACOS_CERTIFICATE_PWD    — password for the .p12 cert
#   PROD_MACOS_CERTIFICATE_NAME   — e.g. "Developer ID Application: Sean Smith (XXXXXXXXXX)"
#   PROD_MACOS_CI_KEYCHAIN_PWD    — CI keychain password (any strong random string)
#   APPLE_NOTARIZATION_ISSUER     — App Store Connect API issuer ID (UUID)
#   APPLE_NOTARIZATION_KEY_ID     — App Store Connect API key ID
#   APPLE_NOTARIZATION_KEY        — App Store Connect API .p8 key contents
#   SPARKLE_PRIVATE_KEY           — EdDSA private key generated by Sparkle's generate_keys

on:
  # Tag-triggered: full release pipeline (build → sign → notarize → publish).
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manually triggered: pipeline iteration without tagging or publishing.
  # Use this to validate signing/notarization changes before tagging a real
  # beta. When dry_run=true, the appcast and release jobs are skipped — the
  # DMG is uploaded as a CI artifact instead of attached to a GitHub Release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and notarize only — skip release upload + appcast"
        type: boolean
        default: true

name: Ghostties Release

# Only one release can run at a time to prevent artifact corruption.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # setup: Extract version, build number, and commit info from the tag
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      build: ${{ steps.extract.outputs.build }}
      commit: ${{ steps.extract.outputs.commit }}
      commit_long: ${{ steps.extract.outputs.commit_long }}
      is_beta: ${{ steps.extract.outputs.is_beta }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history required for accurate build number via rev-list --count
          fetch-depth: 0

      - name: Extract version and build info
        id: extract
        run: |
          # workflow_dispatch has no tag — synthesize a dry-run version from the
          # short commit so downstream steps that template ${VERSION} still work.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SHORT=$(git rev-parse --short HEAD)
            TAG="dryrun-$SHORT"
            VERSION="0.0.0-dryrun.$SHORT"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Build number = total commit count (matches Xcode CFBundleVersion convention)
          echo "build=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_long=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          # Beta flag: tag contains "-beta" (dry-run treated as beta — never stable)
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == dryrun-* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      # Gate on an undocumented release BEFORE anything is built or published —
      # 30 seconds in, nothing to unwind. Moving this same check downstream
      # (inside the release job) is what beta.23 would have broken: its tag
      # predates its own CHANGELOG.md entry (the changelog is maintained on
      # main and can legitimately be updated after a tag is cut), so the
      # check has to read main's CHANGELOG.md, never the tag's. Skipped on
      # workflow_dispatch — its synthesized "0.0.0-dryrun.<sha>" version has
      # no changelog section by construction and isn't a real release.
      - name: Verify changelog entry exists (gate — before any build)
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:CHANGELOG.md > changelog-main.md
          python3 scripts/extract-release-notes.py "$VERSION" changelog-main.md >/dev/null

  # ---------------------------------------------------------------------------
  # build-macos: Build, sign, notarize, and package the Ghostties app
  # ---------------------------------------------------------------------------
  build-macos:
    needs: [setup]
    # macos-26 (Tahoe) is required for the macOS 26 SDK — Backport.swift
    # references NSGlassEffectView and SurfaceView.swift references
    # ConcentricRectangle, both gated by @available(macOS 26, *) but still
    # needing the type to exist at compile time.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GHOSTTIES_VERSION: ${{ needs.setup.outputs.version }}
      GHOSTTIES_BUILD: ${{ needs.setup.outputs.build }}
      GHOSTTIES_COMMIT: ${{ needs.setup.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Xcode version
        run: xcodebuild -version

      # Pin Xcode 26.3 for the Zig build. The macos-26 image's default Xcode
      # moved to 26.5, whose SDK changed libSystem.tbd to reference arm64e-macos
      # instead of aarch64-macos. Zig 0.15.2's linker can't match the two and
      # fails GhosttyKit.xcframework with undefined libSystem symbols
      # (_abort, _free, __availability_version_check, ...). 26.3 is the last
      # SDK Zig 0.15.2 links cleanly against, and still ships all macOS 26 SDK
      # types the Swift app build needs. Matches upstream ghostty-org/ghostty.
      # Re-evaluate when Zig 0.16 ships (ziglang/zig#31658).
      - name: Select Xcode 26.3 (Zig 0.15.2 SDK compatibility)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      # Install Zig 0.15.2 (matches build.zig.zon minimum_zig_version).
      # Required to build GhosttyKit.xcframework from source.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Cache Zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/zig
            zig-out
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Build GhosttyKit.xcframework
        run: zig build -Demit-macos-app=false -Doptimize=ReleaseFast

      # CEF (Chromium Embedded Framework) for the embedded browser feature.
      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            vendor/cef
            vendor/cef-build
          key: cef-${{ runner.os }}-${{ hashFiles('scripts/download-cef.sh', 'scripts/build-cef-wrapper.sh') }}-v1

      - name: Download CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: bash scripts/download-cef.sh

      - name: Build CEF wrapper
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: bash scripts/build-cef-wrapper.sh

      # Build the Ghostties Xcode scheme in Release config.
      # -scheme Ghostties builds DockTilePlugin as a dependency automatically.
      # ONLY_ACTIVE_ARCH=YES ARCHS=arm64 is required because GhosttyKit.xcframework
      # is arm64-only (see build gotcha: reference-xcframework-arm64-only.md).
      # CODE_SIGNING_ALLOWED=NO skips signing during build; the dedicated
      # "Codesign app bundle" step below handles all signing with the CI keychain.
      - name: Build Ghostties.app
        run: |
          cd macos
          # SYMROOT pins the build output to macos/build/ so downstream steps
          # (Update Info.plist, codesign, DMG, notarize) find the .app at the
          # expected macos/build/Release/Ghostties.app path. Without this,
          # xcodebuild writes to ~/Library/Developer/Xcode/DerivedData/.
          xcodebuild \
            -scheme Ghostties \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=

      # Inject version metadata and Sparkle public key into Info.plist.
      # SUPublicEDKey is NOT secret — it's the public half of the EdDSA keypair.
      - name: Update Info.plist
        run: |
          PLIST="macos/build/Release/Ghostties.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $GHOSTTIES_COMMIT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GHOSTTIES_BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $GHOSTTIES_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey p4A5Tc5lUgQGbOEnOGesE7YA+EPePQxKiLrKdRfvdMg=" "$PLIST"
          # Keep SUEnableAutomaticChecks=true so Sparkle skips the permission-request
          # prompt path entirely and goes straight to background checking. Deleting
          # this key (old behavior) caused Sparkle to wedge in _showingPermissionRequest
          # forever, silently swallowing every "Check for Updates" click.
          /usr/libexec/PlistBuddy -c "Set :SUEnableAutomaticChecks true" "$PLIST"

      - name: Codesign app bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          # Decode the base64-encoded certificate to a .p12 file
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12

          # Create a temporary CI keychain so codesign runs headlessly (no UI prompt)
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain

          APP="macos/build/Release/Ghostties.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          CEF_FRAMEWORK="$FRAMEWORKS/Chromium Embedded Framework.framework"

          # --- CEF inside-out signing ---
          # Apple's notarization requires all nested binaries to be signed before
          # the outer bundle. CEF helper apps each need per-variant entitlements:
          # Renderer + GPU need allow-jit (V8/WebGL JIT), Plugin needs
          # disable-library-validation, Base + Alerts need minimal hardened runtime.

          # 1. Sign nested dylibs/binaries inside the CEF framework first.
          if [ -d "$CEF_FRAMEWORK" ]; then
            find "$CEF_FRAMEWORK" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
              | while IFS= read -r -d '' f; do
                /usr/bin/codesign --force --timestamp --options runtime \
                  --sign "$MACOS_CERTIFICATE_NAME" "$f"
              done

            # 2. Sign the CEF framework bundle itself.
            /usr/bin/codesign --force --timestamp --options runtime \
              --sign "$MACOS_CERTIFICATE_NAME" "$CEF_FRAMEWORK"

            # 3. Sign each helper app with per-variant entitlements.
            for HELPER in "$FRAMEWORKS"/Ghostties\ Helper*.app; do
              case "$HELPER" in
                *"Renderer"*|*"GPU"*)
                  ENT="macos/Helper-Renderer.entitlements" ;;
                *"Plugin"*)
                  ENT="macos/Helper-Plugin.entitlements" ;;
                *)
                  ENT="macos/Helper.entitlements" ;;
              esac
              /usr/bin/codesign --force --timestamp --options runtime \
                --entitlements "$ENT" \
                --sign "$MACOS_CERTIFICATE_NAME" "$HELPER"
            done
          fi
          # --- end CEF inside-out signing ---

          # Sign Sparkle XPC services (required even though we don't sandbox Ghostties;
          # the binaries in Versions/ must be real files, not symlinks)
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            "$APP/Contents/Frameworks/Sparkle.framework"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            "$APP/Contents/PlugIns/DockTilePlugin.plugin"

          # Sign the app bundle itself with entitlements
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime \
            --entitlements "macos/Ghostties.entitlements" "$APP"

      # Notarization must run — and staple succeed — on the app bundle BEFORE
      # it gets packaged into the DMG or the release zip, otherwise whichever
      # artifact is built first ships an unstapled app (see BACKLOG.md history:
      # create-dmg used to run before stapling, so the DMG's copy of the app
      # never received the notarization ticket while the zip's copy did).
      - name: Zip app for notarization submission
        run: |
          cd macos/build/Release
          # ditto (not zip) preserves the code signature exactly as notarytool
          # expects for submission. This zip is a transient submission vehicle
          # only — the release zip is built fresh from the stapled app below.
          ditto -c -k --keepParent Ghostties.app ../../../notarization-submission.zip

      - name: Notarize app
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        run: |
          # Write the .p8 key to a temp file for notarytool
          echo "$APPLE_NOTARIZATION_KEY" > notarization_key.p8
          xcrun notarytool store-credentials "notarytool-profile" \
            --key notarization_key.p8 \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER"
          rm notarization_key.p8

          # Submit and wait for Apple's notarization service.
          # Capture submission ID so we can fetch the detailed log if it fails.
          # --wait exits non-zero on Invalid, so we tee output and parse the ID.
          set -o pipefail
          xcrun notarytool submit "notarization-submission.zip" \
            --keychain-profile "notarytool-profile" \
            --wait | tee notarytool-submit.log
          NOTARIZE_EXIT=${PIPESTATUS[0]}

          # Always fetch the detailed log — Apple's per-file rejection reasons
          # only appear via `notarytool log`, never in the submit output.
          SUBMISSION_ID=$(grep -m1 "id:" notarytool-submit.log | head -1 | awk '{print $2}')
          if [ -n "$SUBMISSION_ID" ]; then
            echo "::group::Notarization detailed log (submission $SUBMISSION_ID)"
            xcrun notarytool log "$SUBMISSION_ID" \
              --keychain-profile "notarytool-profile" || true
            echo "::endgroup::"
          fi

          if [ "$NOTARIZE_EXIT" != "0" ]; then
            echo "::error::Notarization failed (exit $NOTARIZE_EXIT). See log above."
            exit "$NOTARIZE_EXIT"
          fi

          # Staple the ticket so Gatekeeper validates the app offline. This
          # must happen before Create DMG and Zip app below, so both
          # packaged artifacts ship the stapled app, not just one of them.
          xcrun stapler staple "macos/build/Release/Ghostties.app"

      - name: Create DMG
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          npm install --global create-dmg@8.1.0
          create-dmg \
            --identity="$MACOS_CERTIFICATE_NAME" \
            ./macos/build/Release/Ghostties.app \
            ./
          mv ./Ghostties*.dmg ./Ghostties.dmg

      # create-dmg signs the DMG itself with a separate code signature/CDHash
      # from the app inside it, so the app's notarization ticket (stapled
      # above) does not cover the DMG. Without this second round trip, a
      # direct DMG download needs an online Gatekeeper check just to mount —
      # the same class of bug this PR set out to fix, just moved to a
      # different artifact. The app packaged inside is already stapled at
      # this point, so this covers the "double-click the DMG" install path
      # on top of the "copy the app out" path handled above.
      - name: Notarize DMG
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        run: |
          # Credentials were already stored under this profile name by the
          # "Notarize app" step above; reuse it.
          set -o pipefail
          xcrun notarytool submit "Ghostties.dmg" \
            --keychain-profile "notarytool-profile" \
            --wait | tee notarytool-submit-dmg.log
          NOTARIZE_EXIT=${PIPESTATUS[0]}

          # Always fetch the detailed log — Apple's per-file rejection reasons
          # only appear via `notarytool log`, never in the submit output.
          SUBMISSION_ID=$(grep -m1 "id:" notarytool-submit-dmg.log | head -1 | awk '{print $2}')
          if [ -n "$SUBMISSION_ID" ]; then
            echo "::group::DMG notarization detailed log (submission $SUBMISSION_ID)"
            xcrun notarytool log "$SUBMISSION_ID" \
              --keychain-profile "notarytool-profile" || true
            echo "::endgroup::"
          fi

          if [ "$NOTARIZE_EXIT" != "0" ]; then
            echo "::error::DMG notarization failed (exit $NOTARIZE_EXIT). See log above."
            exit "$NOTARIZE_EXIT"
          fi

          xcrun stapler staple "Ghostties.dmg"

      - name: Zip app
        run: |
          cd macos/build/Release
          zip -9 -r --symlinks ../../../ghostties-macos-arm64.zip Ghostties.app

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            Ghostties.dmg
            ghostties-macos-arm64.zip

  # ---------------------------------------------------------------------------
  # appcast: Sign the DMG and generate Sparkle appcast XML files
  #
  # For stable releases (tag has no "-beta"): update both appcast-stable.xml
  #   and appcast-beta.xml so stable users and beta users both receive the update.
  # For beta releases (tag contains "-beta"): update only appcast-beta.xml so
  #   stable channel users are not offered pre-release builds.
  # ---------------------------------------------------------------------------
  appcast:
    needs: [setup, build-macos]
    permissions:
      contents: write
    # Skip appcast generation on dry-run — we're not publishing.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: macos-26
    env:
      GHOSTTIES_VERSION: ${{ needs.setup.outputs.version }}
      GHOSTTIES_BUILD: ${{ needs.setup.outputs.build }}
      GHOSTTIES_COMMIT: ${{ needs.setup.outputs.commit }}
      GHOSTTIES_COMMIT_LONG: ${{ needs.setup.outputs.commit_long }}
      IS_BETA: ${{ needs.setup.outputs.is_beta }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos

      # SPARKLE_SHA256 is the SHA-256 of the exact release zip below, computed
      # by downloading the pinned artifact directly and running
      # `shasum -a 256`. Verified 2026-08-01 — do not bump either value without
      # re-verifying the hash against the new artifact.
      - name: Setup Sparkle CLI
        env:
          SPARKLE_VERSION: "2.9.4"
          SPARKLE_SHA256: "cb6fdbdc8884f15d62a616e79face92b08322410fd2d425edc6596ccbf4ba3b0"
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" -o sparkle.zip
          echo "${SPARKLE_SHA256}  sparkle.zip" | shasum -a 256 -c -
          unzip sparkle.zip
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Sign DMG and generate appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Write private key to a temp path outside the checkout (never the
          # repo working dir), lock down permissions, sign, then remove it.
          # Cleanup also runs in a dedicated `if: always()` step below in case
          # this step fails after the key is written.
          SPARKLE_KEY_FILE="$(mktemp)"
          echo "SPARKLE_KEY_FILE=$SPARKLE_KEY_FILE" >> "$GITHUB_ENV"
          umask 077
          echo "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          chmod 600 "$SPARKLE_KEY_FILE"
          sign_update -f "$SPARKLE_KEY_FILE" Ghostties.dmg > sign_update.txt
          rm -f "$SPARKLE_KEY_FILE"

          # Parse EdDSA signature and file length from sign_update output
          SIGNATURE=$(python3 -c "
          import re, sys
          txt = open('sign_update.txt').read()
          m = re.search(r'sparkle:edSignature=\"([^\"]+)\"', txt)
          print(m.group(1) if m else sys.exit(1))
          ")
          LENGTH=$(python3 -c "
          import re, sys
          txt = open('sign_update.txt').read()
          m = re.search(r'length=\"([^\"]+)\"', txt)
          print(m.group(1) if m else sys.exit(1))
          ")

          DMG_URL="${SERVER_URL}/${REPOSITORY}/releases/download/v${GHOSTTIES_VERSION}/Ghostties.dmg"
          NOW=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          REPO="${SERVER_URL}/${REPOSITORY}"

          python3 - \
            "$GHOSTTIES_VERSION" \
            "$GHOSTTIES_BUILD" \
            "$GHOSTTIES_COMMIT" \
            "$GHOSTTIES_COMMIT_LONG" \
            "$SIGNATURE" \
            "$LENGTH" \
            "$DMG_URL" \
            "$NOW" \
            "$REPO" \
            "$IS_BETA" <<'PYEOF'
          import sys

          version, build, commit, commit_long, signature, length, dmg_url, now, repo, is_beta_str = sys.argv[1:]
          is_beta = is_beta_str.lower() == "true"

          item_xml = f"""  <item>
              <title>Ghostties v{version}</title>
              <pubDate>{now}</pubDate>
              <sparkle:version>{build}</sparkle:version>
              <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>13.0.0</sparkle:minimumSystemVersion>
              <description><![CDATA[
                <h1>Ghostties v{version}</h1>
                <p>Built from commit <a href="{repo}/commits/{commit_long}">{commit}</a>.</p>
                <p>See <a href="{repo}/releases/tag/v{version}">release notes</a> on GitHub.</p>
              ]]></description>
              <enclosure
                url="{dmg_url}"
                type="application/octet-stream"
                sparkle:edSignature="{signature}"
                length="{length}" />
            </item>"""

          def make_appcast(title, desc, item):
              return f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>{title}</title>
              <description>{desc}</description>
          {item}
            </channel>
          </rss>"""

          # Beta appcast always includes this release
          with open("appcast-beta.xml", "w") as f:
              f.write(make_appcast(
                  "Ghostties Beta Releases",
                  "Beta and stable releases of Ghostties",
                  item_xml
              ))

          if is_beta:
              # Beta release: stable channel gets a no-op placeholder so the
              # artifact always exists on the GitHub Release for download by URL.
              print("Beta tag detected — stable channel unchanged.")
              stable_xml = """<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Ghostties Stable Releases</title>
              <description>No stable release available yet.</description>
            </channel>
          </rss>"""
          else:
              print("Stable tag detected — updating both channels.")
              stable_xml = make_appcast(
                  "Ghostties Stable Releases",
                  "Stable releases of Ghostties",
                  item_xml
              )

          with open("appcast-stable.xml", "w") as f:
              f.write(stable_xml)
          PYEOF

      - name: Remove Sparkle signing key
        if: always()
        run: rm -f "$SPARKLE_KEY_FILE"

      - name: Upload appcast artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appcasts
          path: |
            appcast-stable.xml
            appcast-beta.xml

      - name: Commit appcast to web/
        run: |
          # Save generated appcasts + DMG before switching to main branch
          cp appcast-beta.xml /tmp/appcast-beta.xml
          cp appcast-stable.xml /tmp/appcast-stable.xml
          DMG_SIZE_BYTES=$(stat -f%z Ghostties.dmg 2>/dev/null || stat -c%s Ghostties.dmg)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main:main
          git switch main

          cp /tmp/appcast-beta.xml web/appcast-beta.xml
          if [[ "$IS_BETA" != "true" ]]; then
            cp /tmp/appcast-stable.xml web/appcast-stable.xml
          fi

          # Update version strings in web HTML files. DMG size is passed
          # so the meta line on /download stays in sync with the binary.
          python3 scripts/update-web-version.py "$TAG_NAME" "$DMG_SIZE_BYTES"

          # Regenerate web/changelog.html from main's CHANGELOG.md so it never
          # drifts from the source of truth.
          python3 scripts/generate-changelog-page.py

          git add web/appcast-beta.xml web/appcast-stable.xml scripts/update-web-version.py web/index.html web/download.html web/changelog.html
          if git diff --cached --quiet; then
            echo "No appcast changes to commit."
          else
            git commit -m "chore(appcast): update from ${GITHUB_REF_NAME} [skip ci]"

            # main can advance while the ~40min build runs (Sean often has
            # several parallel sessions). A rejected push here must not sink
            # the whole release — release job needs this job to succeed, and
            # the DMG is already signed and notarized by this point. Retry a
            # bounded number of times: fetch, rebase onto the new tip, push
            # again. A real rebase conflict (someone else touched the same
            # web files) aborts and fails loudly rather than guessing at a
            # resolution.
            PUSH_OK=false
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                PUSH_OK=true
                break
              fi
              echo "Push rejected (attempt ${attempt}/5) — main advanced. Rebasing…"

              # Guarded explicitly (not left to the default `bash -e`): a
              # transient network fetch failure must consume a retry, not
              # kill the step that exists to survive transients.
              if ! git fetch origin main; then
                echo "Fetch failed (attempt ${attempt}/5) — network flake, retrying…"
                sleep 5
                continue
              fi

              if ! git rebase origin/main; then
                GIT_DIR="$(git rev-parse --git-dir)"
                if [[ -d "$GIT_DIR/rebase-merge" || -d "$GIT_DIR/rebase-apply" ]]; then
                  echo "::error::Rebase onto origin/main hit a real conflict on the appcast/web files. Aborting rather than guessing at a resolution."
                  git rebase --abort
                else
                  echo "::error::Rebase onto origin/main could not even start (dirty working tree) — not a conflict."
                fi
                exit 1
              fi

              # A parallel session (Sean routinely runs 2-7) may have landed
              # its own CHANGELOG.md change during this rebase. The rebase
              # can succeed cleanly even though CHANGELOG.md moved — no
              # conflict, different file — leaving web/changelog.html stale
              # relative to the CHANGELOG.md now underneath it. Regenerate
              # from the freshly-rebased source and fold it into the same
              # commit before retrying the push.
              python3 scripts/generate-changelog-page.py
              git add web/changelog.html
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi

              sleep 5
            done
            if [[ "$PUSH_OK" != "true" ]]; then
              echo "::error::Failed to push to main after 5 attempts."
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # release: Create the GitHub Release with all artifacts attached
  # ---------------------------------------------------------------------------
  release:
    needs: [setup, build-macos, appcast]
    # Skip GitHub Release creation on dry-run — DMG stays as a CI artifact only.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      IS_BETA: ${{ needs.setup.outputs.is_beta }}
      GHOSTTIES_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      # Checkout must come before the artifact downloads below — actions/checkout
      # defaults to `clean: true` and runs `git clean -ffdx`, which would wipe
      # the downloaded DMG/appcast files if it ran after them.
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos

      - name: Download appcast artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appcasts

      # Non-fatal by design: the DMG is already signed, notarized, and
      # public as a CI artifact by this point, and appcast has already
      # pushed the version bump to main. This step must never be what kills
      # a release whose artifacts are already out — fall back to a minimal
      # body instead of failing. The real gate lives in `setup`, before
      # anything was built. CHANGELOG.md is read from main (not this job's
      # tag checkout) because the changelog can legitimately be updated
      # after its tag was cut — see beta.23, whose entry postdates its tag.
      - name: Extract release notes
        run: |
          set -uo pipefail
          git fetch origin main
          git show origin/main:CHANGELOG.md > changelog-main.md
          if ! python3 scripts/extract-release-notes.py "$GHOSTTIES_VERSION" changelog-main.md > release-notes.md; then
            echo "::warning::No changelog section for v${GHOSTTIES_VERSION} — falling back to a minimal release body."
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "Ghostties v${GHOSTTIES_VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$IS_BETA" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            --repo "$REPOSITORY" \
            --title "Ghostties v${GHOSTTIES_VERSION}" \
            --notes-file release-notes.md \
            Ghostties.dmg \
            ghostties-macos-arm64.zip \
            appcast-stable.xml \
            appcast-beta.xml

  # ---------------------------------------------------------------------------
  # homebrew-cask: Bump the cask locally and PR it into the tap
  #
  # Inert until Sean creates the SeanSmithWorks/homebrew-tap repo and sets the
  # HOMEBREW_TAP_REPO repository variable — see dist/ghostties/homebrew/README.md for
  # the activation steps. Gated on `vars` (not `secrets`) at the job level
  # because the `secrets` context isn't reliably readable in a job-level
  # `if:`; the HOMEBREW_TAP_TOKEN secret itself is checked inside the job so
  # a missing token fails loudly instead of silently skipping.
  #
  # This job deliberately never commits to `main`: it checks out `ghostties`
  # read-only to run scripts/update-cask-version.sh and copy the bumped cask
  # into the tap. The in-repo dist/ghostties/homebrew/ghostties.rb therefore
  # trails the tap until someone runs the bump script by hand (documented in
  # dist/ghostties/homebrew/README.md) — a deliberate trade against giving
  # this pipeline a second unrelated write path to main, on a pipeline with
  # an expensive bug history.
  # ---------------------------------------------------------------------------
  homebrew-cask:
    needs: [setup, release]
    if: ${{ vars.HOMEBREW_TAP_REPO != '' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Verify HOMEBREW_TAP_TOKEN is set
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_REPO is set but the HOMEBREW_TAP_TOKEN secret is missing. Add a token with push access to ${HOMEBREW_TAP_REPO} — see dist/ghostties/homebrew/README.md." >&2
            exit 1
          fi

      - name: Checkout ghostties
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Bump cask (local checkout only, not committed)
        run: bash scripts/update-cask-version.sh "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Sync cask into tap and open PR
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../dist/ghostties/homebrew/ghostties.rb Casks/ghostties.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Casks/ghostties.rb; then
            echo "Tap cask already up to date with ${TAG}."
            exit 0
          fi

          BRANCH="update-ghostties-${TAG}"
          git checkout -b "$BRANCH"
          git add Casks/ghostties.rb
          git commit -m "chore(ghostties): update to ${TAG}"
          git push origin "$BRANCH"
          if ! gh pr view "$BRANCH" --repo "$HOMEBREW_TAP_REPO" >/dev/null 2>&1; then
            gh pr create \
              --repo "$HOMEBREW_TAP_REPO" \
              --title "Update ghostties to ${TAG}" \
              --body "Automated sync from SeanSmithWorks/ghostties release ${TAG}." \
              --head "$BRANCH" \
              --base main
          fi
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}

  # ---------------------------------------------------------------------------
  # verify-release: Assert every live distribution surface actually reports the
  # released version — not that the steps that publish it merely ran. This is
  # the check that would have caught beta.24 shipping with a stale changelog
  # page, an empty release body, etc: those steps all reported success while
  # doing nothing. Runs last; failing here does NOT unpublish anything (the
  # release already exists by this point) — the value is a visible red X
  # instead of silent drift.
  # ---------------------------------------------------------------------------
  verify-release:
    needs: [setup, release]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GHOSTTIES_VERSION: ${{ needs.setup.outputs.version }}
      TAG: ${{ needs.setup.outputs.tag }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    timeout-minutes: 25
    steps:
      - name: Verify live release surfaces
        run: |
          VERSION="$GHOSTTIES_VERSION"
          FAIL=0
          ROWS=()

          row() {
            # $1=surface $2=expected $3=actual $4=PASS|FAIL|PENDING|NOT VERIFIED
            ROWS+=("$1|$2|$3|$4")
            if [[ "$4" == "FAIL" ]]; then FAIL=1; fi
          }

          # Retries $* up to $attempts times, $delay seconds apart. The appcast
          # commit triggers a Vercel deploy that isn't instant, so the web
          # checks below need to tolerate a short propagation window rather
          # than failing on the first cold read.
          poll() {
            local attempts="$1" delay="$2"
            shift 2
            local i=1
            while (( i <= attempts )); do
              if "$@"; then
                return 0
              fi
              echo "  attempt ${i}/${attempts} not current yet (status: ${STATUS:-unknown}), retrying in ${delay}s…"
              sleep "$delay"
              i=$((i + 1))
            done
            return 1
          }

          # Fetches $2 into $1, always capturing the HTTP status separately
          # from curl's own exit code — a redirect, 4xx, or 5xx must never
          # be read as "the page loaded and the version is wrong" (FAIL);
          # it means we couldn't verify at all (NOT VERIFIED). No -f/-L:
          # ghostties.org serves these pages directly with no redirect, so
          # a 3xx here is itself a signal something's off, not something to
          # silently follow.
          curl_get() {
            local outfile="$1" url="$2"
            HTTP_CODE=$(curl -sS --max-time 20 --retry 2 --retry-delay 2 \
              -o "$outfile" -w '%{http_code}' "$url" 2>/tmp/curl-stderr.log)
            return $?
          }

          # Anchors a version match so "0.1.0" cannot match inside
          # "0.1.0-beta.24" — a plain substring grep would pass vacuously
          # the moment a stable release ships alongside its own betas.
          version_present() {
            local file="$1" esc
            esc=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
            grep -Pq "v${esc}(?![0-9.])" "$file"
          }

          # --- 1. Sparkle beta appcast ---
          check_appcast() {
            if ! curl_get /tmp/appcast.xml "https://ghostties.org/appcast-beta.xml"; then
              STATUS="unreachable"; ACTUAL="<curl error, see log>"; return 1
            fi
            if [[ "$HTTP_CODE" != "200" ]]; then
              STATUS="unreachable"; ACTUAL="HTTP ${HTTP_CODE}"; return 1
            fi
            ACTUAL=$(grep -o 'sparkle:shortVersionString>[^<]*' /tmp/appcast.xml | head -1 | cut -d'>' -f2)
            if [[ "$ACTUAL" == "$VERSION" ]]; then
              STATUS="ok"; return 0
            fi
            STATUS="stale"; return 1
          }
          if poll 10 30 check_appcast; then
            row "Sparkle appcast (beta)" "$VERSION" "$ACTUAL" "PASS"
          elif [[ "$STATUS" == "unreachable" ]]; then
            row "Sparkle appcast (beta)" "$VERSION" "$ACTUAL" "NOT VERIFIED"
          else
            row "Sparkle appcast (beta)" "$VERSION" "$ACTUAL" "FAIL"
          fi

          # --- 2. Appcast enclosure URL actually resolves ---
          # The whole beta.24 failure class was "a surface points at
          # something that isn't there" — this is the one check that would
          # have caught a DMG URL the appcast advertises but that 404s.
          # Range request (`-r 0-0`) so this doesn't pull down the full DMG.
          check_dmg_url() {
            if ! curl_get /tmp/appcast-dmg.xml "https://ghostties.org/appcast-beta.xml"; then
              STATUS="unreachable"; ACTUAL="<curl error fetching appcast>"; return 1
            fi
            if [[ "$HTTP_CODE" != "200" ]]; then
              STATUS="unreachable"; ACTUAL="HTTP ${HTTP_CODE} (appcast)"; return 1
            fi
            local url code
            url=$(grep -o 'url="[^"]*Ghostties\.dmg"' /tmp/appcast-dmg.xml | head -1 | sed -e 's/^url="//' -e 's/"$//')
            if [[ -z "$url" ]]; then
              STATUS="unreachable"; ACTUAL="<no enclosure url in appcast>"; return 1
            fi
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -L -r 0-0 "$url" 2>/tmp/curl-stderr.log)
            ACTUAL="${url} (HTTP ${code})"
            if [[ "$code" == "200" || "$code" == "206" ]]; then
              STATUS="ok"; return 0
            fi
            STATUS="stale"; return 1
          }
          if poll 6 20 check_dmg_url; then
            row "Appcast DMG URL resolves" "200/206" "$ACTUAL" "PASS"
          elif [[ "$STATUS" == "unreachable" ]]; then
            row "Appcast DMG URL resolves" "200/206" "$ACTUAL" "NOT VERIFIED"
          else
            row "Appcast DMG URL resolves" "200/206" "$ACTUAL" "FAIL"
          fi

          # --- 3. Homepage ---
          # Every semver-shaped token on the page must equal this release's
          # version — that catches both "not updated" and "updated but an
          # older beta.N is still visible somewhere else on the page."
          check_homepage() {
            if ! curl_get /tmp/homepage.html "https://ghostties.org/"; then
              STATUS="unreachable"; ACTUAL="<curl error, see log>"; return 1
            fi
            if [[ "$HTTP_CODE" != "200" ]]; then
              STATUS="unreachable"; ACTUAL="HTTP ${HTTP_CODE}"; return 1
            fi
            local found
            found=$(grep -oE '0\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?' /tmp/homepage.html | sort -u | tr '\n' ',' | sed 's/,$//')
            ACTUAL="$found"
            if [[ "$found" == "$VERSION" ]]; then
              STATUS="ok"; return 0
            fi
            STATUS="stale"; return 1
          }
          if poll 10 30 check_homepage; then
            row "Homepage (ghostties.org)" "$VERSION" "$ACTUAL" "PASS"
          elif [[ "$STATUS" == "unreachable" ]]; then
            row "Homepage (ghostties.org)" "$VERSION" "$ACTUAL" "NOT VERIFIED"
          else
            row "Homepage (ghostties.org)" "$VERSION" "$ACTUAL" "FAIL"
          fi

          # --- 4. Changelog page ---
          check_changelog() {
            if ! curl_get /tmp/changelog.html "https://ghostties.org/changelog"; then
              STATUS="unreachable"; ACTUAL="<curl error, see log>"; return 1
            fi
            if [[ "$HTTP_CODE" != "200" ]]; then
              STATUS="unreachable"; ACTUAL="HTTP ${HTTP_CODE}"; return 1
            fi
            if version_present /tmp/changelog.html; then
              ACTUAL="present"; STATUS="ok"; return 0
            fi
            ACTUAL="missing"; STATUS="stale"; return 1
          }
          if poll 10 30 check_changelog; then
            row "Changelog page" "v${VERSION} present" "$ACTUAL" "PASS"
          elif [[ "$STATUS" == "unreachable" ]]; then
            row "Changelog page" "v${VERSION} present" "$ACTUAL" "NOT VERIFIED"
          else
            row "Changelog page" "v${VERSION} present" "$ACTUAL" "FAIL"
          fi

          # --- 5. GitHub Release ---
          # No polling needed — this is the authoritative record the release
          # job just wrote to, not a downstream mirror with propagation lag.
          check_release() {
            local assets body esc
            assets=$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null) || return 1
            body=$(gh release view "$TAG" --repo "$REPOSITORY" --json body --jq '.body' 2>/dev/null) || return 1
            ACTUAL=$(echo "$assets" | tr '\n' ',' | sed 's/,$//')
            if [[ -z "$body" ]]; then
              ACTUAL="${ACTUAL} | body: <empty>"
              return 1
            fi
            esc=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
            if ! echo "$body" | grep -Pq "v${esc}(?![0-9.])"; then
              ACTUAL="${ACTUAL} | body: present but missing v${VERSION}"
              return 1
            fi
            echo "$assets" | grep -qx "Ghostties.dmg" && echo "$assets" | grep -qx "ghostties-macos-arm64.zip"
          }
          ACTUAL="<not found>"
          if check_release; then
            row "GitHub Release ${TAG}" "assets + non-empty notes with v${VERSION}" "$ACTUAL" "PASS"
          else
            row "GitHub Release ${TAG}" "assets + non-empty notes with v${VERSION}" "$ACTUAL" "FAIL"
          fi

          # --- 6. Homebrew tap cask ---
          # Conditional: the tap repo only exists once Sean sets HOMEBREW_TAP_REPO
          # (see the homebrew-cask job above). Silently skipping this surface is
          # exactly the drift class this job exists to catch, so an unset
          # variable is a loud NOT VERIFIED row, never a quiet pass. The
          # homebrew-cask job only ever opens a PR against the tap — it never
          # merges — so a behind cask with an open update PR is a pending,
          # human-in-the-loop state, not a pipeline failure.
          if [[ -z "$HOMEBREW_TAP_REPO" ]]; then
            echo "::warning::HOMEBREW_TAP_REPO is not set — Homebrew tap cask NOT VERIFIED."
            row "Homebrew tap cask" "$VERSION" "HOMEBREW_TAP_REPO unset" "NOT VERIFIED"
          else
            check_tap() {
              if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
                STATUS="unreachable"; ACTUAL="HOMEBREW_TAP_TOKEN unset"; return 1
              fi
              local b64 content tap_version
              # gh's own exit status is checked explicitly — piping straight
              # into `base64 -d` under a non-pipefail shell would otherwise
              # let a 404/403/5xx render as an empty, "stale" cask instead
              # of the unreachable/unauthenticated state it actually is.
              b64=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api "repos/${HOMEBREW_TAP_REPO}/contents/Casks/ghostties.rb" --jq '.content' 2>/tmp/tap-err.log)
              if [[ $? -ne 0 || -z "$b64" ]]; then
                STATUS="unreachable"; ACTUAL="API error: $(tail -c 200 /tmp/tap-err.log)"; return 1
              fi
              content=$(printf '%s' "$b64" | base64 -d 2>/dev/null)
              if [[ -z "$content" ]]; then
                STATUS="unreachable"; ACTUAL="<empty cask content>"; return 1
              fi
              tap_version=$(echo "$content" | grep -oE 'version "[^"]+"' | head -1 | cut -d'"' -f2)
              if [[ -z "$tap_version" ]]; then
                STATUS="unreachable"; ACTUAL="<version not found in cask>"; return 1
              fi
              ACTUAL="$tap_version"
              if [[ "$tap_version" == "$VERSION" ]]; then
                STATUS="ok"; return 0
              fi
              STATUS="stale"; return 1
            }
            if poll 3 15 check_tap; then
              row "Homebrew tap cask" "$VERSION" "$ACTUAL" "PASS"
            elif [[ "$STATUS" == "unreachable" ]]; then
              echo "::warning::Homebrew tap cask unreachable/unauthenticated — NOT VERIFIED."
              row "Homebrew tap cask" "$VERSION" "$ACTUAL" "NOT VERIFIED"
            else
              PR_COUNT=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh pr list --repo "$HOMEBREW_TAP_REPO" \
                --head "update-ghostties-${TAG}" --state open --json number --jq '. | length' 2>/dev/null || echo 0)
              if [[ "${PR_COUNT:-0}" -gt 0 ]]; then
                row "Homebrew tap cask" "$VERSION" "${ACTUAL} (update PR open, pending merge)" "PENDING"
              else
                row "Homebrew tap cask" "$VERSION" "$ACTUAL" "FAIL"
              fi
            fi
          fi

          # --- Summary ---
          {
            echo "## Release verification — v${VERSION}"
            echo ""
            echo "| Surface | Expected | Actual | Status |"
            echo "|---|---|---|---|"
            for r in "${ROWS[@]}"; do
              IFS='|' read -r surface expected actual status <<< "$r"
              echo "| ${surface} | ${expected} | ${actual} | ${status} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FAIL" == "1" ]]; then
            echo "::error::One or more release surfaces are behind v${VERSION}. See the job summary."
            exit 1
          fi
          echo "All checkable surfaces report v${VERSION}."
