<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    a { color: #5B8DEF; } a:hover { color: #3E6FD0; }
    .stage { width: 480px; height: 560px; background: #F0E9E6; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .card { width: 360px; background: #FAF7F3; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.30); overflow: hidden; }
    .tag { position: absolute; top: 14px; left: 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #9A8F88; text-transform: uppercase; }
    .wrap { position: relative; }
    .field { display: flex; align-items: baseline; font-size: 15px; line-height: 20px; }
    .typed { color: #1A1A1A; }
    .ghost { color: #1A1A1A7E; }
    .caret { width: 1.5px; height: 16px; background: #1A1A1A; align-self: center; }
    .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; }
    .rt { font-size: 13px; font-weight: 500; color: #1a1a1a; flex-grow: 1; }
    .slot { width: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>
