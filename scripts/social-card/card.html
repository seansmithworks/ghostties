<!doctype html>
<!--
  ghostties.org social card (og:image / twitter:image), 2560x1280.
  Rendered to web/assets/social-card.png by scripts/social-card/render.sh,
  which serves the REPO ROOT — hence the /web/... paths below. Lives outside
  web/ so it never deploys as a page.

  Ghosts are not drawn here. The page loads the live site's own
  web/assets/ghost-field.js under prefers-reduced-motion (its static path:
  one buildSVG() per ghost, no animation), then lifts those SVGs into the
  row. Redraw a ghost in ghost-field.js and the card follows on re-render.

  Values (web/DESIGN.md): --bg, --ink, --font-mono from §8 (the v2/v3 token
  set the live homepage uses); diff colours from §3 "Hero terminal".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ghostties social card</title>
<link rel="preload" href="/web/assets/fonts/dmmono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "DM Mono";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("/web/assets/fonts/dmmono-400-latin.woff2") format("woff2");
  }
  :root {
    --bg: #06060e;
    --ink: #e9e6f5;
    --font-mono: "DM Mono", monospace;
    --diff-add-fg: rgba(100, 220, 120, 0.9);
    --diff-add-bg: rgba(80, 210, 100, 0.13);
    --diff-del-fg: rgba(255, 100, 100, 0.7);
    --diff-del-bg: rgba(255, 80, 80, 0.13);
  }
  html, body {
    margin: 0;
    width: 2560px;
    height: 1280px;
    overflow: hidden;
    background: var(--bg);
  }
  .card {
    box-sizing: border-box;
    width: 2560px;
    height: 1280px;
    padding: 304px 0 0 0;
    font-family: var(--font-mono);
    font-size: 72px;
    line-height: 136px;
    color: var(--ink);
  }
  /* Text column starts at 192px; the diff gutter (+/-) hangs left of it. */
  .line { padding-left: 192px; white-space: pre; }
  /* Both diff bars share one width (the longer line + 48px), starting 92px
     left of the text column so the +/- sits in the gutter. */
  .diffs { display: inline-block; margin-left: 100px; }
  .diff { position: relative; padding: 0 48px 0 92px; white-space: pre; }
  .diff .sign { position: absolute; left: 12px; }
  .del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
  .add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
  .ghosts {
    display: flex;
    gap: 48px;
    padding-left: 192px;
    margin-top: 72px;
  }
  .ghosts svg {
    display: block;
    width: 192px;   /* 12 cells x 16px — integer scale, no seams */
    height: 192px;
    overflow: visible;
    shape-rendering: crispEdges;
  }
  /* Same two rules v3.css applies at rest: the glass sheen is hover-only
     and the blink cover is hidden unless mid-blink. */
  .ghosts svg .gx-glass,
  .ghosts svg .gx-blink-cover { opacity: 0; }
  #gx-field { display: none; }
  .missing { color: #ff3b3b; }
</style>
</head>
<body>
  <div class="card">
    <div class="line">cd ~/ghostties</div>
    <div class="diffs">
      <div class="diff del"><span class="sign">-</span>ghostties % install soon</div>
      <div class="diff add"><span class="sign">+</span>ghostties % install now</div>
    </div>
    <div class="line">ghostties.org</div>
    <div class="ghosts" id="ghosts"></div>
  </div>
  <div id="gx-field"></div>
  <script>
    // Card shows a row of 8: the first eight of ghost-field.js's roster,
    // in source order. <html data-ready> is "ok" or "missing"; render.sh
    // reads it and refuses to write the PNG unless it is "ok".
    window.addEventListener("load", function () {
      var row = document.getElementById("ghosts");
      var svgs = document.querySelectorAll("#gx-field .gx-ghost svg");
      if (svgs.length < 8) {
        row.innerHTML = '<div class="missing">GHOSTS MISSING: ' + svgs.length +
          " rendered — ghost-field.js did not take its reduced-motion path</div>";
        document.documentElement.dataset.ready = "missing";
        return;
      }
      for (var i = 0; i < 8; i++) row.appendChild(svgs[i]);
      document.documentElement.dataset.ready = "ok";
    });
  </script>
  <script src="/web/assets/ghost-field.js"></script>
</body>
</html>
